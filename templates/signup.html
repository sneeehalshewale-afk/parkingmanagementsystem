<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign Up - Parking System</title>
<style>
body, html { margin:0; padding:0; height:100%; font-family:'Arial',sans-serif; display:flex; justify-content:center; align-items:center; overflow:hidden;}
#bg-video {position:fixed; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:-1;}
.overlay {position:fixed; inset:0; background:rgba(0,0,0,0.55);}
.signup-container {position: relative; background: rgba(255,255,255,0.25); backdrop-filter: blur(12px); border-radius:20px; padding:50px 40px; width:380px; text-align:center; color:white; box-shadow:0 8px 25px rgba(0,0,0,0.4);}
.signup-container h2 {margin-bottom:25px; font-size:28px; letter-spacing:1px;}
.signup-container input {width:100%; padding:14px; margin:12px 0; border-radius:12px; border:none; background: rgba(255,255,255,0.15); color:white; font-size:16px;}
.signup-container input::placeholder {color:#e0e0e0;}
.signup-container button {width:100%; padding:14px; background:#0ea5e9; border:none; border-radius:12px; color:white; font-size:16px; cursor:pointer; margin-top:10px;}
.signup-container button:hover {background:#0369a1; transform:translateY(-2px);}
.signup-container a {color:#38bdf8; text-decoration:none;}
</style>
</head>
<body>
<video autoplay muted loop id="bg-video">
    <source src="{{ url_for('static', filename='videos/parking_animation1.mp4') }}" type="video/mp4">
</video>
<div class="overlay"></div>

<div class="signup-container">
    <h2>Sign Up</h2>
    <form method="POST" action="{{ url_for('signup') }}">
        <input type="text" name="username" placeholder="Username" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <input type="password" name="confirm_password" placeholder="Confirm Password" required>
        <button type="submit">Sign Up</button>
    </form>
    {% if error %}<div style="color:#ff6b6b;margin-top:10px;">{{ error }}</div>{% endif %}
    <p style="margin-top:15px;color:white;">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
</div>
</body>
</html>
