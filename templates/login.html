<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - Parking System</title>
<style>
body, html {
    margin:0;
    padding:0;
    height:100%;
    font-family: 'Arial', sans-serif;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
}

#bg-video {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-1;
}

.overlay {
    position:fixed;
    inset:0;
    background: rgba(0,0,0,0.55);
}

.login-container {
    position: relative;
    background: rgba(255,255,255,0.25); /* slightly more opaque */
    backdrop-filter: blur(12px);        /* glass effect */
    border-radius: 20px;
    padding: 50px 40px;
    width: 350px;
    text-align: center;
    color: white;
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    animation: fadeIn 1s ease-in-out;
}

.login-container h2 {
    margin-bottom: 25px;
    font-size: 28px;
    letter-spacing: 1px;
}

.login-container input {
    width: 100%;
    padding: 14px;
    margin: 12px 0;
    border-radius: 12px;
    border: none;
    background: rgba(255,255,255,0.15);
    color: white;
    font-size: 16px;
}

.login-container input::placeholder {
    color: #e0e0e0;
}

.login-container button {
    width: 100%;
    padding: 14px;
    background: #0ea5e9;
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
    margin-top: 10px;
}

.login-container button:hover {
    background: #0369a1;
    transform: translateY(-2px);
}

.login-container a {
    color: #38bdf8;
    text-decoration: none;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<video autoplay muted loop id="bg-video">
    <source src="{{ url_for('static', filename='videos/parking_animation.mp4') }}" type="video/mp4">
</video>
<div class="overlay"></div>

<div class="login-container">
    <h2>Login</h2>
    <form method="POST" action="{{ url_for('login') }}">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
    {% if error %}<div style="color:#ff6b6b;margin-top:10px;">{{ error }}</div>{% endif %}
    <p style="margin-top:15px;color:white;">Don’t have an account? <a href="{{ url_for('signup') }}">Sign up</a></p>
</div>

</body>
</html>
