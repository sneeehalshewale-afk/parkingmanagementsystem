<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Parking Report</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body {
    font-family: 'Roboto', sans-serif;
    background: #f4f7fa;
    margin: 0;
    padding: 0;
}
h1 {
    text-align: center;
    color: #333;
    margin-top: 30px;
    font-weight: 700;
}
.container {
    max-width: 1000px;
    margin: 20px auto 50px auto;
    padding: 20px;
}
.back-btn, .refresh-btn {
    display: inline-block;
    margin-bottom: 20px;
    padding: 10px 18px;
    background: #0ea5e9;
    color: white;
    border-radius: 8px;
    text-decoration: none;
    transition: 0.3s;
    cursor: pointer;
}
.back-btn:hover, .refresh-btn:hover {
    background: #0369a1;
}
table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(0,0,0,0.1);
}
th, td {
    padding: 15px 12px;
    text-align: center;
}
th {
    background: #0ea5e9;
    color: #fff;
    font-weight: 500;
    text-transform: uppercase;
}
tr:nth-child(even) {
    background: #f1f5f9;
}
tr:hover {
    background: #dbeafe;
    transform: scale(1.02);
    transition: 0.2s;
}
.status {
    font-weight: 500;
    color: #10b981;
}
.status.still {
    color: #f59e0b;
}
</style>
</head>
<body>
<h1>🚗 Parking Report</h1>
<div class="container">
    <a href="/index" class="back-btn">⬅ Back</a>
<button class="refresh-btn" onclick="location.reload()">🔄 Refresh</button>

    <table>
        <tr>
            <th>Owner Name</th>
            <th>Vehicle Number</th>
            <th>Check-In Time</th>
            <th>Check-Out Time</th>
        </tr>
        {% for row in records %}
        <tr>
            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
            <td>{{ row[2] }}</td>
            <td class="status {% if not row[3] %}still{% endif %}">{{ row[3] if row[3] else "Still Parked" }}</td>
        </tr>
        {% endfor %}
    </table>
</div>
</body>
</html>
