<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Parking Problems</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body {
    font-family: 'Roboto', sans-serif;
    background: #f4f7fa;
    margin: 0;
    padding: 20px;
}
h1 {
    text-align: center;
    color: #333;
    margin-top: 30px;
    font-weight: 700;
}
.container {
    max-width: 900px;
    margin: 20px auto 50px auto;
    padding: 20px;
}
.back-btn {
    display: inline-block;
    margin-bottom: 20px;
    padding: 10px 18px;
    background: #0ea5e9;
    color: white;
    border-radius: 8px;
    text-decoration: none;
    transition: 0.3s;
}
.back-btn:hover {
    background: #0369a1;
}
table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(0,0,0,0.1);
}
th, td {
    padding: 15px 12px;
    text-align: center;
}
th {
    background: #f97316; 
    color: #fff;
    font-weight: 500;
    text-transform: uppercase;
}
tr:nth-child(even) {
    background: #f1f5f9;
}
tr:hover {
    background: #ffe7d6;
    transform: scale(1.02);
    transition: 0.2s;
}
.status {
    font-weight: 500;
    color: #ef4444; 
}
.refresh-btn {
    padding: 10px 20px;
    background: #f97316;
    color: white;
    border: none;
    border-radius: 5px;
    margin-bottom: 20px;
    cursor: pointer;
}
.refresh-btn:hover {
    background: #c2410c;
}
</style>
</head>
<body>
<h1>⚠️ Parking Problems</h1>
<div class="container">
    <a href="/index" class="back-btn">⬅ Back</a>
    <button class="refresh-btn" onclick="location.reload();">🔄 Refresh</button>
    <table>
        <tr>
            <th>Problem ID</th>
            <th>Slot Number</th>
            <th>Floor</th>
            <th>Description</th>
            <th>Status</th>
        </tr>
    </table>
</div>
</body>
</html>
